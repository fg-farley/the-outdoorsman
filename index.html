/* -------------------------------
Dropdown
-------------------------------- */

.dropdown{
    position:relative;
}

.dropdown>a{
    display:flex;
    align-items:center;
    gap:8px;
}

.dropdown-arrow{
    font-size:.65rem;
    transition:.3s;
}

.dropdown:hover .dropdown-arrow{
    transform:rotate(180deg);
}

.dropdown-menu{

    position:absolute;
    top:calc(100% + 15px);
    left:50%;
    transform:translateX(-50%) translateY(12px);

    min-width:230px;

    background:rgba(10,10,10,.94);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.08);

    border-radius:14px;

    padding:12px 0;

    opacity:0;
    visibility:hidden;

    transition:.35s ease;

    box-shadow:
        0 25px 60px rgba(0,0,0,.35);

    z-index:9999;
}

.dropdown:hover .dropdown-menu{

    opacity:1;
    visibility:visible;

    transform:translateX(-50%) translateY(0);

}

.dropdown-menu li{

    list-style:none;

}

.dropdown-menu a{

    display:block;

    padding:12px 24px;

    color:white;

    text-decoration:none;

    font-size:.95rem;

    transition:.25s;

}

.dropdown-menu a:hover{

    background:rgba(255,255,255,.06);

    padding-left:30px;

}

    .hero{
      position:relative;
      min-height:100svh;
      isolation:isolate;
      overflow:hidden;
      background:#7d95b3;
    }
      
      .mag-cover{
              width: 200px;
    margin-bottom: 2rem;

    /* ---------- PARALLAX STAGE ---------- */

    .scene{
      position:absolute;
      inset:-5%;
      z-index:0;
      overflow:hidden;
      pointer-events:none;
    }

    .parallax-layer{
      position:absolute;
      inset:0;
      transform:
        translate3d(
          calc(var(--pointer-x) * var(--x-depth, 0px)),
          calc((var(--pointer-y) * var(--y-depth, 0px)) + (var(--scroll-shift) * var(--scroll-depth, 0))),
          0
        );
      will-change:transform;
    }

    .parallax-layer > img{
      position:absolute;
      display:block;
      max-width:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* Moving sky: larger than viewport so it can drift without exposing edges */
    .sky-layer{
      --x-depth: 5px;
      --y-depth: 3px;
      --scroll-depth: .02;
      inset:-8%;
      animation:skyPan 24s ease-in-out infinite alternate;
    }

    .sky-layer img{
      inset:0;
      width:112%;
      height:112%;
      object-fit:cover;
      object-position:center 42%;
      filter:saturate(1.03) contrast(1.02);
    }

    /* Distant mountains */
    .mountain-layer{
      --x-depth: 10px;
      --y-depth: 6px;
      --scroll-depth: .04;
      top:17%;
    }

    .mountain-layer img{
      left:-5%;
      bottom:8%;
      width:110%;
      height:auto;
      filter:saturate(.82) brightness(.82);
    }

    /* Forest and meadow */
    .forest-layer{
      --x-depth: 16px;
      --y-depth: 10px;
      --scroll-depth: .065;
      top:29%;
    }

    .forest-layer img{
      left:-5%;
      bottom:33%;
      width:110%;
      height:auto;
      filter:saturate(.75) brightness(.68) contrast(1.04);
    }

    /* Rolling hill layers */
    .hill-middle{
      --x-depth: 22px;
      --y-depth: 14px;
      --scroll-depth: .085;
      top:48%;
    }

    .hill-middle img{
      left:-6%;
      bottom:-4%;
      width:112%;
      height:auto;
      filter:saturate(.72) brightness(.60);
    }

    .hill-front{
      --x-depth: 29px;
      --y-depth: 18px;
      --scroll-depth: .11;
      top:59%;
    }

    .hill-front img{
      left:-6%;
      bottom:-7%;
      width:112%;
      height:auto;
      filter:saturate(.68) brightness(.50);
    }
      
.clouds-layer{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}

.clouds-layer img{
  position:absolute;
  display:block;
  width:auto;
  max-width:none;
  height:auto;
  opacity:.72;
  filter:blur(.2px);
  will-change:transform;
}

/* Slower, more distant cloud layer */
.clouds-back{
  z-index:1;
}

.clouds-back img{
    top: 1%;
    left: -40%;
    width: 35vw;
    min-width: 410px;
    opacity: 1;
    animation: cloudMoveBack 65s linear infinite;
    background-blend-mode: multiply;
}

/* Closer cloud layer */
.clouds-front{
  z-index:2;
}

.clouds-front img{
    top: 3%;
    left: -55%;
    width: 32vw;
    min-width: 300px;
    opacity: 1;
    animation: cloudMoveFront 34s linear infinite;
    background-blend-mode: multiply;
}

@keyframes cloudMoveBack{
  from{
    transform:translate3d(0,0,0);
  }

  to{
    transform:translate3d(190vw,-2vh,0);
  }
}

@keyframes cloudMoveFront{
  from{
    transform:translate3d(0,0,0);
  }

  to{
    transform:translate3d(210vw,2vh,0);
  }
}
      
.clouds-back .cloud{
  top:8%;
  width:75vw;
  min-width:700px;
}

.clouds-back .cloud-a{
  left:-75vw;
  animation:cloudLoop 50s linear infinite;
}

.clouds-back .cloud-b{
  left:0;
  animation:cloudLoop 50s linear infinite;
}

@keyframes cloudLoop{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(150vw);
  }
}

    /* Geese */
/* Birds sit behind every mountain, forest and hill layer */
.birds-layer{
  --x-depth: 7px;
  --y-depth: 4px;
  --scroll-depth: .025;

  z-index: 0;
  inset: 0;
  opacity: .65;
}

.birds-layer img{
    position: absolute;
    top: 0%;
    /* width: clamp(210px, 28vw, 460px); */
    height: auto;
    max-width: none;
    display: block;
    width: 60vw;
    height: auto;
    filter: blur(1px);
}

    .bird{
      position:absolute;
      width:54px;
      height:25px;
      filter:drop-shadow(0 3px 4px rgba(0,0,0,.22));
    }

    .bird::before,
    .bird::after{
      content:"";
      position:absolute;
      top:10px;
      width:30px;
      height:5px;
      border-radius:100%;
      background:#31372e;
    }

    .bird::before{
      right:50%;
      transform:rotate(-22deg);
      transform-origin:right center;
    }

    .bird::after{
      left:50%;
      transform:rotate(22deg);
      transform-origin:left center;
    }

    .bird:nth-child(1){left:3%;top:31%;transform:scale(1)}
    .bird:nth-child(2){left:8%;top:25%;transform:scale(.84)}
    .bird:nth-child(3){left:14%;top:35%;transform:scale(.7)}
    .bird:nth-child(4){left:19%;top:28%;transform:scale(.58)}
    .bird:nth-child(5){left:25%;top:38%;transform:scale(.47)}

    /* Hunter */
    .hunter-layer{
      --x-depth: 38px;
      --y-depth: 24px;
      --scroll-depth: .145;
      z-index:7;
    }

.hunter-layer img{
  right:8%;
  bottom:-10%;
  height:87%;
  width:auto;

  transform-origin:48% 78%;

  animation:hunterAimFocus 8s ease-in-out infinite alternate;

  will-change:transform, filter;
}

    /* Tallgrass: three separate foreground bands */
    .grass-back{
      --x-depth: 32px;
      --y-depth: 19px;
      --scroll-depth: .12;
      z-index:6;
    }

    .grass-back img{
      left:-4%;
      bottom:-15%;
      width:108%;
      height:auto;
      opacity:.56;
      filter:brightness(.62) saturate(.58);
      transform-origin:bottom center;
      animation:grassBackSway 6.2s ease-in-out infinite alternate;
    }

    .grass-mid{
      --x-depth: 48px;
      --y-depth: 30px;
      --scroll-depth: .18;
      z-index:8;
    }

    .grass-mid img{
    left: -15%;
    bottom: -1%;
    width: 80%;
    height: auto;
    /* opacity: .78; */
    filter: brightness(.42) saturate(.60);
    transform-origin: bottom center;
    animation: grassMidSway 4.8s ease-in-out infinite alternate;
    }

    .grass-front{
      --x-depth: 64px;
      --y-depth: 40px;
      --scroll-depth: .23;
      z-index:10;
    }

    .grass-front img{
    left: 55%;
    bottom: 3%;
    width: 54%;
    height: auto;
    filter: brightness(.42) saturate(.60);
    transform-origin: bottom center;
    animation: grassFrontSway 4s ease-in-out infinite alternate;
    }

    /* Cinematic grading */
    .scene-grade{
      position:absolute;
      inset:0;
      z-index:11;
      pointer-events:none;
      background:
        linear-gradient(90deg,
          rgba(5,9,6,.79) 0%,

          rgba(5,9,6,.09) 73%,

          rgba(8,12,8,.07) 0%,
          rgba(8,12,8,.01) 46%,
          rgba(4,8,5,.73) 100%
        ),
        radial-gradient(circle at 69% 34%,
          rgba(239,149,65,.13),
          transparent 31%
        );
    }

    .sun-glow{

        radial-gradient(circle at 58% 28%,

      mix-blend-mode:screen;
    }

      animation:scrollBounce 1.8s ease-in-out infinite;
    }

    /* ---------- ANIMATION ---------- */

    @keyframes skyPan{
      0%{
        transform:translate3d(-1.3%,0,0) scale(1.03);
      }
      100%{
        transform:translate3d(1.4%,-.8%,0) scale(1.07);
      }
    }

    @keyframes birdFlight{
      0%{transform:translate3d(-31vw,7vh,0);opacity:0}
      8%{opacity:.88}
      75%{opacity:.88}
      100%{transform:translate3d(124vw,-17vh,0);opacity:0}
    }

    @keyframes grassBackSway{
      from{transform:rotate(-.45deg) translateX(-.3%)}
      to{transform:rotate(.9deg) translateX(.4%)}
    }

    @keyframes grassMidSway{
      from{transform:rotate(-.8deg) translateX(-.45%)}
      to{transform:rotate(1.35deg) translateX(.55%)}
    }

    @keyframes grassFrontSway{
      from{transform:rotate(-1deg) translateX(-.55%)}
      to{transform:rotate(1.7deg) translateX(.7%)}
    }

    @keyframes scrollBounce{
      0%,100%{transform:rotate(45deg) translate(0,0);opacity:.45}
      50%{transform:rotate(45deg) translate(5px,5px);opacity:1}
    }
      
@keyframes hunterAim{
  0%{
    transform:
      rotate(-2.5deg)
      translate3d(0, 4px, 0);
  }

  45%{
    transform:
      rotate(-1deg)
      translate3d(0, 1px, 0);
  }

  100%{
    transform:
      rotate(.75deg)
      translate3d(0, -3px, 0);
  }
}
      
@keyframes hunterAimFocus{
  0%{
    transform:
      rotate(-2deg)
      translate3d(0, 3px, 0)
      scale(1);

    filter:
      blur(0px)
      drop-shadow(-18px 28px 30px rgba(0,0,0,.42))
      saturate(.86)
      brightness(.80)
      contrast(1.03);
  }

  50%{
    transform:
      rotate(-.7deg)
      translate3d(1px, 0, 0)
      scale(1.002);

    filter:
      blur(.35px)
      drop-shadow(-18px 28px 30px rgba(0,0,0,.42))
      saturate(.84)
      brightness(.79)
      contrast(1.02);
  }

  100%{
    transform:
      rotate(.5deg)
      translate3d(0, -2px, 0)
      scale(1.004);

    filter:
      blur(.7px)
      drop-shadow(-18px 28px 30px rgba(0,0,0,.42))
      saturate(.82)
      brightness(.78)
      contrast(1.01);
  }
}

/* =========================================================
   MOBILE HERO FIX
   Add this after all existing styles
========================================================= */

@media (max-width: 767.98px){

  html,
  body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
  }

  .hero{
    width:100%;
    height:100svh;
    min-height:680px;
    max-height:none;
    overflow:hidden;
  }

  .hero-content{
    width:100%;
    height:100svh;
    min-height:680px;
    padding-top:115px;
    padding-bottom:35px;
    align-items:flex-start;
  }

  /*
   * Remove the oversized negative scene inset on mobile.
   * The desktop -5% inset can create visual overflow below the hero.
   */
  .scene{
    inset:0;
    width:100%;
    height:100%;
  }

  /* Keep the background sky covering the complete hero */
  .sky-layer{
    inset:-8%;
  }

  .sky-layer img{
    width:116%;
    height:116%;
    inset:-8%;
    object-fit:cover;
    object-position:center center;
  }

  /* Bring the hunter into the visible portion of the screen */

  <script>
    (() => {
      const root = document.documentElement;
      const hero = document.getElementById('hero');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (reduceMotion) return;

      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;

      hero.addEventListener('pointermove', (event) => {
        const rect = hero.getBoundingClientRect();

        targetX = ((event.clientX - rect.left) / rect.width - 0.5) * 2;
        targetY = ((event.clientY - rect.top) / rect.height - 0.5) * 2;
      });

      hero.addEventListener('pointerleave', () => {
        targetX = 0;
        targetY = 0;
      });

      function animatePointer(){
        currentX += (targetX - currentX) * 0.07;
        currentY += (targetY - currentY) * 0.07;

        root.style.setProperty('--pointer-x', currentX.toFixed(4));
        root.style.setProperty('--pointer-y', currentY.toFixed(4));

        requestAnimationFrame(animatePointer);
      }

      function updateScroll(){
        const rect = hero.getBoundingClientRect();
        const progress = Math.max(
          -1,
          Math.min(1, -rect.top / Math.max(hero.offsetHeight, 1))
        );

        root.style.setProperty('--scroll-shift', `${progress * 90}px`);
      }

      window.addEventListener('scroll', updateScroll, { passive:true });

      updateScroll();
      animatePointer();
    })();
  </script>
